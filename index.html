<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4 meses</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #e6e1d8;
      color: #241f1b;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      background: #f6f3ee;
      padding: 12px 12px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nota,
    .cierre {
      margin: 0;
      font: 500 16px/1.35 "Segoe UI", system-ui, sans-serif;
    }
    .nota {
      color: #6d645b;
      font-size: 14px;
    }
    .collage {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: start;
    }
    /*
      Mapa de colocación.
      Cada fotografía tiene el mismo HTML. Para reorganizar
      el collage se cambia solo este bloque, no cada imagen.
      Estado provisional (20 de 29): todas ocupan una celda.
      La composición asimétrica espera a FOTO_21–FOTO_29.
    */
    .collage .foto {
      grid-column: span 1;
      position: relative;
      margin: 0;
      aspect-ratio: 1;
      overflow: hidden;
    }
    .collage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .collage img:not([src]) {
      display: none;
    }
    .collage .foto:has(img:not([src])) {
      border: 1px dashed #b7aea3;
      display: grid;
      place-items: center;
    }
    .collage .foto:has(img:not([src]))::before {
      content: "FOTO_" attr(data-foto);
      font: 500 12px/1 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.04em;
      color: #8a8178;
    }
    @media (min-width: 800px) {
      body { padding: 28px 0 40px; }
      main {
        max-width: 980px;
        padding: 16px 16px 26px;
      }
      .collage {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="nota">Veinte fotografías identificadas. El collage sigue abierto: faltan las nueve restantes.</p>
    <!--
      29 figuras con la misma estructura, en orden FOTO_01 a FOTO_29.
      Este orden es la identidad de cada foto. No se reordena el HTML
      para componer: la colocación vive en el mapa CSS de .collage.
      FOTO_21 a FOTO_29 están reservadas y todavía no tienen archivo.
    -->
    <section class="collage" aria-label="Collage en preparación, veinte de veintinueve fotografías">
      <figure class="foto" data-foto="01">

</body>
</html>
