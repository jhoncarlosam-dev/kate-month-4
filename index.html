<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4 meses</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #e6e1d8;
      color: #241f1b;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      background: #f6f3ee;
      padding: 12px 12px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      container-type: inline-size;
    }
    .cierre,
    .dedicatoria {
      margin: 0;
      font: 500 16px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    .cierre {
      margin-top: 6px;
    }
    .dedicatoria {
      max-width: 36em;
      color: #4a433d;
    }
    .collage {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-flow: dense;
      gap: 8px;
      align-items: start;
    }
    .collage .foto {
      position: relative;
      margin: 0;
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }
    .collage .foto:nth-child(3),
    .collage .foto:nth-child(11),
    .collage .foto:nth-child(14),
    .collage .foto:nth-child(18),
    .collage .foto:nth-child(21),
    .collage .foto:nth-child(23),
    .collage .foto:nth-child(24),
    .collage .foto:nth-child(26),
    .collage .foto:nth-child(27) {
      aspect-ratio: 3 / 4;
    }
    .collage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    .collage .foto:nth-child(3) img,
    .collage .foto:nth-child(11) img,
    .collage .foto:nth-child(14) img,
    .collage .foto:nth-child(18) img,
    .collage .foto:nth-child(21) img,
    .collage .foto:nth-child(23) img,
    .collage .foto:nth-child(26) img,
    .collage .foto:nth-child(27) img {
      object-position: center center;
    }
    .collage .foto:nth-child(5),
    .collage .foto:nth-child(9),
    .collage .foto:nth-child(12) {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 9;
    }
    .collage .foto:nth-child(5) img {
      object-position: center bottom;
    }
    .collage .foto:nth-child(9) img {
      object-position: 76% 42%;
    }
    .collage .foto:nth-child(10) img {
      object-position: 42% 46%;
    }
    .collage .foto:nth-child(12) img {
      object-position: center 62%;
    }
    @media (min-width: 800px) {
      body { padding: 28px 0 48px; }
      main {
        max-width: 1080px;
        padding: 18px 18px 28px;
      }
      /*
        Mapa de colocación.
        Cada fotografía conserva el mismo HTML. Para reorganizar
        el collage se cambia solo este bloque.
      */
      .collage {
        --gap: 8px;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-auto-rows: calc((100cqi - 5 * var(--gap)) / 6 + var(--gap) / 4);
        gap: var(--gap);
        align-items: stretch;
      }
      .collage .foto,
      .collage .foto:nth-child(3),
      .collage .foto:nth-child(11),
      .collage .foto:nth-child(14),
      .collage .foto:nth-child(18),
      .collage .foto:nth-child(21),
      .collage .foto:nth-child(23),
      .collage .foto:nth-child(24),
      .collage .foto:nth-child(26),
      .collage .foto:nth-child(27) {
        aspect-ratio: auto;
        height: auto;
      }
      .collage .foto:nth-child(n) {
        aspect-ratio: auto;
      }
      .collage .foto:nth-child(1) { grid-column: 3 / span 4; grid-row: 1 / span 2; }
      .collage .foto:nth-child(2) { grid-column: 3 / span 4; grid-row: 9 / span 2; }
      .collage .foto:nth-child(3) { grid-column: 1 / span 2; grid-row: 25 / span 4; }
      .collage .foto:nth-child(4) { grid-column: 1 / span 2; grid-row: 7 / span 2; }
      .collage .foto:nth-child(5) { grid-column: 1 / span 4; grid-row: 13 / span 2; }
      .collage .foto:nth-child(6) { grid-column: 3 / span 4; grid-row: 11 / span 2; }
      .collage .foto:nth-child(7) { grid-column: 1 / span 4; grid-row: 5 / span 2; }
      .collage .foto:nth-child(8) { grid-column: 1 / span 2; grid-row: 15 / span 2; }
      .collage .foto:nth-child(9) { grid-column: 3 / span 2; grid-row: 23 / span 2; }
      .collage .foto:nth-child(10) { grid-column: 3 / span 4; grid-row: 25 / span 4; }
      .collage .foto:nth-child(11) { grid-column: 5 / span 2; grid-row: 13 / span 4; }
      .collage .foto:nth-child(12) { grid-column: 1 / span 4; grid-row: 21 / span 2; }
      .collage .foto:nth-child(13) { grid-column: 3 / span 2; grid-row: 19 / span 2; }
      .collage .foto:nth-child(14) { grid-column: 5 / span 2; grid-row: 21 / span 4; }
      .collage .foto:nth-child(15) { grid-column: 1 / span 2; grid-row: 23 / span 2; }
      .collage .foto:nth-child(16) { grid-column: 3 / span 2; grid-row: 7 / span 2; }
      .collage .foto:nth-child(17) { grid-column: 5 / span 2; grid-row: 29 / span 2; }
      .collage .foto:nth-child(18) { grid-column: 1 / span 2; grid-row: 17 / span 4; }
      .collage .foto:nth-child(19) { grid-column: 3 / span 2; grid-row: 3 / span 2; }
      .collage .foto:nth-child(20) { grid-column: 5 / span 2; grid-row: 31 / span 2; }
      .collage .foto:nth-child(21) { grid-column: 5 / span 2; grid-row: 5 / span 4; }
      .collage .foto:nth-child(22) { grid-column: 3 / span 2; grid-row: 15 / span 2; }
      .collage .foto:nth-child(23) { grid-column: 1 / span 2; grid-row: 1 / span 4; }
      .collage .foto:nth-child(24) { grid-column: 1 / span 2; grid-row: 9 / span 4; }
      .collage .foto:nth-child(25) { grid-column: 3 / span 4; grid-row: 17 / span 2; }
      .collage .foto:nth-child(26) { grid-column: 1 / span 2; grid-row: 29 / span 4; }
      .collage .foto:nth-child(27) { grid-column: 3 / span 2; grid-row: 29 / span 4; }
      .collage .foto:nth-child(28) { grid-column: 5 / span 2; grid-row: 3 / span 2; }
      .collage .foto:nth-child(29) { grid-column: 5 / span 2; grid-row: 19 / span 2; }
    }
  </style>
</head>
<body>

    <p class="cierre">4 meses. 20 de noviembre de 2026.</p>
    <p class="dedicatoria">Collage de fotos por nuestros 4 meses de novios. Te amo Katerine, espero que sean muchos meses más ❤</p>

</body>
</html>
