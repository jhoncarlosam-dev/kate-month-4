<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4 meses</title>
  <style>
    @font-face {
      font-family: Inter;
      src: url("fonts/Inter-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: Inter;
      src: url("fonts/Inter-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #e7e2da;
      color: #161513;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    main { max-width: 1180px; margin: 0 auto; background: #f4f1eb; }
    .marco { container-type: inline-size; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 2px 16px;
    }
    h1 {
      margin: 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-weight: 500;
    }
    .num {
      font-weight: 700;
      font-size: 108px;
      letter-spacing: -0.055em;
      line-height: 0.72;
    }
    .meses {
      font-size: 30px;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .fecha {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      color: #5c564e;
    }

    /*
      El HTML de cada foto es el mismo. El puesto vive aquí:
      --c y --r de cada nth-child.
      Para mover una foto, se cambia su puesto en el CSS.
    */
    .collage {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }
    .slot {
      grid-column: var(--c, auto);
      grid-row: var(--r, auto);
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #e4ddd2;
    }
    .slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--p, center);
      display: block;
    }
    .slot:not(:has(img[src])) img { display: none; }
    .slot:not(:has(img[src]))::after {
      content: attr(data-n);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #8a837a;
    }

    .slot:nth-child(1)  { --p: 50% 42%; }
    .slot:nth-child(3)  { --p: 42% 40%; }
    .slot:nth-child(4)  { --p: 40% 44%; }
    .slot:nth-child(5)  { --p: 50% 46%; }
    .slot:nth-child(8)  { --p: 50% 40%; }
    .slot:nth-child(11) { --p: 62% 48%; }
    .slot:nth-child(13) { --p: 50% 42%; }
    .slot:nth-child(14) { --p: 50% 58%; }
    .slot:nth-child(16) { --p: 50% 28%; }
    .slot:nth-child(18) { --p: 50% 62%; }
    .slot:nth-child(20) { --p: 50% 28%; }
    .slot:nth-child(22) { --p: 50% 62%; }
    .slot:nth-child(23) { --p: 50% 30%; }
    .slot:nth-child(25) { --p: 46% 42%; }
    .slot:nth-child(26) { --p: 50% 46%; }
    .slot:nth-child(28) { --p: 50% 42%; }

    @media (min-width: 761px) {
      body { padding: 28px 16px 48px; }
      main { padding: 8px 22px 22px; }
      .num { font-size: 112px; }
      .collage {
        grid-template-columns: repeat(8, 1fr);
        grid-auto-rows: calc((100cqi - 7 * 6px) / 8 * 1.15);
      }
      .slot:nth-child(1)  { --c: 5 / span 4; --r: 1 / span 2; }
      .slot:nth-child(2)  { --c: 7 / span 2; --r: 27 / span 1; }
      .slot:nth-child(3)  { --c: 5 / span 2; --r: 7 / span 3; }
      .slot:nth-child(4)  { --c: 5 / span 4; --r: 5 / span 2; }
      .slot:nth-child(5)  { --c: 1 / span 4; --r: 10 / span 2; }
      .slot:nth-child(6)  { --c: 5 / span 2; --r: 26 / span 1; }
      .slot:nth-child(7)  { --c: 1 / span 4; --r: 15 / span 2; }
      .slot:nth-child(8)  { --c: 3 / span 6; --r: 17 / span 3; }
      .slot:nth-child(9)  { --c: 1 / span 4; --r: 26 / span 2; }
      .slot:nth-child(10) { --c: 5 / span 4; --r: 3 / span 2; }
      .slot:nth-child(11) { --c: 5 / span 2; --r: 28 / span 1; }
      .slot:nth-child(12) { --c: 7 / span 2; --r: 26 / span 1; }
      .slot:nth-child(13) { --c: 1 / span 6; --r: 20 / span 3; }
      .slot:nth-child(14) { --c: 7 / span 2; --r: 20 / span 3; }
      .slot:nth-child(15) { --c: 3 / span 6; --r: 23 / span 3; }
      .slot:nth-child(16) { --c: 7 / span 2; --r: 12 / span 3; }
      .slot:nth-child(17) { --c: 5 / span 4; --r: 10 / span 2; }
      .slot:nth-child(18) { --c: 1 / span 2; --r: 7 / span 3; }
      .slot:nth-child(19) { --c: 5 / span 2; --r: 27 / span 1; }
      .slot:nth-child(20) { --c: 1 / span 2; --r: 17 / span 3; }
      .slot:nth-child(21) { --c: 1 / span 2; --r: 28 / span 1; }
      .slot:nth-child(22) { --c: 1 / span 4; --r: 1 / span 6; }
      .slot:nth-child(23) { --c: 7 / span 2; --r: 7 / span 3; }
      .slot:nth-child(24) { --c: 3 / span 2; --r: 28 / span 1; }
      .slot:nth-child(25) { --c: 3 / span 2; --r: 7 / span 3; }
      .slot:nth-child(26) { --c: 1 / span 2; --r: 23 / span 3; }
      .slot:nth-child(27) { --c: 5 / span 4; --r: 15 / span 2; }
      .slot:nth-child(28) { --c: 1 / span 6; --r: 12 / span 3; }
      .slot:nth-child(29) { --c: 7 / span 2; --r: 28 / span 1; }
    }

    @media (max-width: 760px) {
      body { background: #f4f1eb; }
      main { padding: 4px 12px 20px; }
      header { padding: 16px 0 12px; }
      .num { font-size: 76px; }
      .meses { font-size: 22px; }
      .fecha { font-size: 14px; }
      .collage {
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        grid-auto-rows: calc((100cqi - 3 * 5px) / 4 * 1.145);
      }
      .slot:nth-child(1)  { --c: 1 / span 4; --r: 7 / span 2; }
      .slot:nth-child(2)  { --c: 3 / span 2; --r: 41 / span 1; }
      .slot:nth-child(3)  { --c: 1 / span 2; --r: 14 / span 3; }
      .slot:nth-child(4)  { --c: 1 / span 4; --r: 17 / span 2; }
      .slot:nth-child(5)  { --c: 1 / span 4; --r: 21 / span 2; }
      .slot:nth-child(6)  { --c: 3 / span 2; --r: 42 / span 1; }
      .slot:nth-child(7)  { --c: 1 / span 4; --r: 28 / span 2; }
      .slot:nth-child(8)  { --c: 1 / span 4; --r: 33 / span 2; }
      .slot:nth-child(9)  { --c: 1 / span 2; --r: 42 / span 1; }
      .slot:nth-child(10) { --c: 1 / span 4; --r: 12 / span 2; }
      .slot:nth-child(11) { --c: 1 / span 2; --r: 41 / span 1; }
      .slot:nth-child(12) { --c: 1 / span 2; --r: 43 / span 1; }
      .slot:nth-child(13) { --c: 1 / span 4; --r: 35 / span 2; }
      .slot:nth-child(14) { --c: 1 / span 2; --r: 30 / span 3; }
      .slot:nth-child(15) { --c: 1 / span 4; --r: 39 / span 2; }
      .slot:nth-child(16) { --c: 1 / span 2; --r: 23 / span 3; }
      .slot:nth-child(17) { --c: 1 / span 4; --r: 19 / span 2; }
      .slot:nth-child(18) { --c: 1 / span 2; --r: 9 / span 3; }
      .slot:nth-child(19) { --c: 3 / span 2; --r: 43 / span 1; }
      .slot:nth-child(20) { --c: 3 / span 2; --r: 23 / span 3; }
      .slot:nth-child(21) { --c: 1 / span 2; --r: 44 / span 1; }
      .slot:nth-child(22) { --c: 1 / span 4; --r: 1 / span 6; }
      .slot:nth-child(23) { --c: 3 / span 2; --r: 14 / span 3; }
      .slot:nth-child(24) { --c: 3 / span 2; --r: 44 / span 1; }
      .slot:nth-child(25) { --c: 3 / span 2; --r: 9 / span 3; }
      .slot:nth-child(26) { --c: 3 / span 2; --r: 30 / span 3; }
      .slot:nth-child(27) { --c: 1 / span 4; --r: 37 / span 2; }
      .slot:nth-child(28) { --c: 1 / span 4; --r: 26 / span 2; }
      .slot:nth-child(29) { --c: 1 / span 4; --r: 45 / span 2; }
    }
  </style>
</head>
<body>
  <main>
    <div class="marco">
      <header>
        <h1><span class="num">4</span><span class="meses">meses</span></h1>
        <p class="fecha">20 de noviembre</p>

  </main>
