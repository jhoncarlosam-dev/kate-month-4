<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4 meses</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #e6e1d8;
      color: #241f1b;
      font: 500 16px/1.35 "Segoe UI", system-ui, sans-serif;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 12px 28px;
    }
    .estado { margin: 0 0 12px; }
    .estado strong { font-weight: 650; }

    /*
      Etapa 1, sin cerrar.
      img1.jpg–img19.jpg ya están. Cuando lleguen img20–img29,
      no borrar, no reemplazar y no modificar las primeras.
      Solo ocupar los slots pendientes.
      La grilla pareja de ahora es solo para verlas. No es la composición.
      La definitiva (asimétrica) se arma con las 29.
      Para reordenar: cambiar --c y --r de cada nth-child.
      No tocar el HTML de cada foto.
    */
    .collage {
      --cols: 2;
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .slot {
      grid-column: var(--c, auto);
      grid-row: var(--r, auto);
      min-width: 0;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #f6f3ee;
    }
    .slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      display: block;
    }
    .slot:has(img:not([src])) {
      display: grid;
      place-items: center;
      background: #ddd6cc;
      outline: 1px dashed #8a8175;
      outline-offset: -1px;
    }
    .slot:has(img:not([src])) img { display: none; }
    .slot:has(img:not([src]))::before {
      content: attr(data-label) " · pendiente";
      font-size: 13px;
      color: #5c564e;
    }

    .slot:nth-child(1)  { --c: auto; --r: auto; }
    .slot:nth-child(2)  { --c: auto; --r: auto; }
    .slot:nth-child(3)  { --c: auto; --r: auto; }
    .slot:nth-child(4)  { --c: auto; --r: auto; }
    .slot:nth-child(5)  { --c: auto; --r: auto; }
    .slot:nth-child(6)  { --c: auto; --r: auto; }
    .slot:nth-child(7)  { --c: auto; --r: auto; }
    .slot:nth-child(8)  { --c: auto; --r: auto; }
    .slot:nth-child(9)  { --c: auto; --r: auto; }
    .slot:nth-child(10) { --c: auto; --r: auto; }
    .slot:nth-child(11) { --c: auto; --r: auto; }
    .slot:nth-child(12) { --c: auto; --r: auto; }
    .slot:nth-child(13) { --c: auto; --r: auto; }
    .slot:nth-child(14) { --c: auto; --r: auto; }
    .slot:nth-child(15) { --c: auto; --r: auto; }
    .slot:nth-child(16) { --c: auto; --r: auto; }
    .slot:nth-child(17) { --c: auto; --r: auto; }
    .slot:nth-child(18) { --c: auto; --r: auto; }
    .slot:nth-child(19) { --c: auto; --r: auto; }
    .slot:nth-child(20) { --c: auto; --r: auto; }
    .slot:nth-child(21) { --c: auto; --r: auto; }
    .slot:nth-child(22) { --c: auto; --r: auto; }
    .slot:nth-child(23) { --c: auto; --r: auto; }
    .slot:nth-child(24) { --c: auto; --r: auto; }
    .slot:nth-child(25) { --c: auto; --r: auto; }
    .slot:nth-child(26) { --c: auto; --r: auto; }
    .slot:nth-child(27) { --c: auto; --r: auto; }
    .slot:nth-child(28) { --c: auto; --r: auto; }
    .slot:nth-child(29) { --c: auto; --r: auto; }

    @media (min-width: 800px) {
      body { padding: 20px 0 32px; }
      .collage { --cols: 3; }
    }
  </style>
</head>
<body>
  <main>
    <p class="estado">4 meses. 20 de noviembre.<br><strong>19 de 29. El collage no está cerrado.</strong> Falta img20 y, después, img21 a img29.</p>

    </ol>
  </main>
</body>
</html>
